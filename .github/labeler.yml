shell:
  - changed-files:
      - any-glob-to-any-file:
          - 'dot_zshrc'
          - 'dot_zshenv.tmpl'
          - 'dot_zprofile'
          - 'dot_bashrc'
          - 'dot_bash_profile'
          - 'dot_profile'
          - 'dot_zsh_plugins.txt'
          - 'dot_config/fish/**'
          - 'dot_config/zsh/**'

git:
  - changed-files:
      - any-glob-to-any-file:
          - 'dot_gitconfig.tmpl'
          - 'dot_isembard.gitconfig.tmpl'
          - 'dot_config/private_git/**'

editor:
  - changed-files:
      - any-glob-to-any-file:
          - 'dot_config/nvim/**'
          - 'private_Library/**/Cursor/**'

terminal:
  - changed-files:
      - any-glob-to-any-file:
          - 'dot_config/ghostty/**'

ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - '.gitleaks.toml'
          - '.mise.toml'
          - 'mise.lock'
          - 'scripts/**'

tmux:
  - changed-files:
      - any-glob-to-any-file:
          - 'dot_tmux.conf'

chezmoi:
  - changed-files:
      - any-glob-to-any-file:
          - '.chezmoi.toml.tmpl'
          - '.chezmoidata.toml'
          - '.chezmoiexternal.toml'
          - '.chezmoiignore'
          - '.chezmoiversion'
          - 'run_*'
