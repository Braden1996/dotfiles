name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match the mise that generated mise.lock. Newer mise writes `url_api`
  # fields the committed lock does not have, so it rewrites the lock on any
  # install that re-resolves a config-pinned tool -- which the tracked-file
  # assertion below then fails on. Bump this and regenerate mise.lock together,
  # never one without the other.
  MISE_VERSION: 2026.5.0

jobs:
  static:
    name: Static validation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install platform validators
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes fish neovim tmux zsh

      - name: Install validation toolchain
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: ${{ env.MISE_VERSION }}

      - name: Run static checks
        run: mise run check

      - name: Assert validation did not modify tracked files
        run: git diff --exit-code

  chezmoi:
    name: ${{ matrix.os }} / ${{ matrix.profile }} / chezmoi ${{ matrix.chezmoi }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        profile: [personal, work]
        chezmoi: ["2.70.0", "2.71.0"]
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: ${{ env.MISE_VERSION }}
          install: false

      - name: Install selected chezmoi version
        env:
          CHEZMOI_VERSION: ${{ matrix.chezmoi }}
        # Deliberately only chezmoi. Installing anything else here makes mise
        # re-resolve and rewrite mise.lock, which the tracked-file assertion
        # below then fails on. These jobs therefore lint with the runner's own
        # shellcheck, which can be stricter than the pinned one -- so keep the
        # scripts clean at `--severity=info`, not just at whatever mise pins.
        run: mise install "chezmoi@$CHEZMOI_VERSION"

      - name: Render and apply twice in a disposable home
        env:
          CHEZMOI_VERSION: ${{ matrix.chezmoi }}
          PROFILE: ${{ matrix.profile }}
        run: CHEZMOI_BIN="$(mise where "chezmoi@$CHEZMOI_VERSION")/chezmoi" scripts/validate-chezmoi "$PROFILE"

      - name: Assert validation did not modify tracked files
        run: git diff --exit-code

  macos-terminal-smoke:
    name: macOS Ghostty/tmux smoke
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install terminal validators
        run: |
          brew install --formula tmux
          brew install --cask ghostty
          command -v tmux
          test -x /Applications/Ghostty.app/Contents/MacOS/ghostty

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: ${{ env.MISE_VERSION }}
          install: false

      - name: Install pinned chezmoi
        run: mise install chezmoi@2.71.0

      - name: Validate rendered terminal configuration
        run: CHEZMOI_BIN="$(mise where chezmoi@2.71.0)/chezmoi" scripts/validate-chezmoi personal

      - name: Assert validation did not modify tracked files
        run: git diff --exit-code
