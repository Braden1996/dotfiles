# =============================================================================
# Starship Prompt Configuration
# Theme: Catppuccin Macchiato with soft powerline separators
# =============================================================================

# Catppuccin Macchiato Color Palette
palette = "catppuccin_macchiato"

# =============================================================================
# Format Configuration
# =============================================================================
add_newline = true
continuation_prompt = "[▸▹ ](overlay1)"

# Left side: context + character (where you type)
# Dimmed diamond separator between directory and git
format = """$username$hostname$container$directory$git_branch$git_status$git_state $character"""

# Right side: metadata only (time/duration)
right_format = """$cmd_duration$time"""

# =============================================================================
# Character Module (Runes!)
# =============================================================================
[character]
success_symbol = "[ᛃ](bold lavender)"
error_symbol = "[ᛃ](bold red)"
vimcmd_symbol = "[ᛃ](bold mauve)"

# =============================================================================
# Directory Module
# =============================================================================
[directory]
format = "[$read_only]($read_only_style)[$path]($style)"
style = "bold sapphire"
read_only = "󰌾 "
read_only_style = "red"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true
home_symbol = "~"
repo_root_format = "[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style)"
repo_root_style = "bold sapphire"
before_repo_root_style = "dimmed sapphire"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = " "
"Projects" = " "
".config" = " "

# =============================================================================
# Git Modules
# =============================================================================
[git_branch]
format = "[⋄](overlay0)[$symbol$branch]($style)"
symbol = "󰘬"
style = "mauve"

[git_status]
disabled = false
format = '([$all_status$ahead_behind]($style))'
style = "flamingo"
conflicted = "󰞇 "
ahead = "󰜷${count}"
behind = "󰜮${count}"
diverged = "󰹺 󰜷${ahead_count}󰜮${behind_count}"
up_to_date = ""
untracked = "󰜄 "
stashed = ""
modified = "󰏫 "
staged = "󰐗 "
renamed = "󰑕 "
deleted = "󰍶 "

[git_commit]
format = "[ $hash$tag]($style) "
tag_symbol = " 󰓹 "
style = "mauve"

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[󰇚 PICKING](bold red)"
rebase = "[󰳖 REBASING](bold mauve)"
merge = "[󰘭 MERGING](bold blue)"
revert = "[󰕍 REVERTING](bold yellow)"
bisect = "[󰃻 BISECTING](bold peach)"

# =============================================================================
# Time & Duration
# =============================================================================
[cmd_duration]
format = "[󱎫 $duration]($style) "
style = "peach"
min_time = 2000

[time]
disabled = false
format = "$time"
time_format = "%R"
utc_time_offset = "local"
style = "subtext1"

# =============================================================================
# SSH & Container Indicators
# =============================================================================
[hostname]
ssh_only = true
ssh_symbol = "󰣀 "
format = "[$ssh_symbol$hostname]($style) "
style = "bold flamingo"

[container]
format = "[$symbol $name]($style) "
symbol = "󰡨"
style = "bold mauve"

[username]
show_always = false
format = "[$user]($style)@"
style_user = "flamingo"
style_root = "bold red"

