# Static, non-secret coordinates for credentials. The vault name itself is
# machine-local; these item and field names are the same everywhere.
[credentials]
# Keys are per-machine: the real item titles are these prefixes followed by
# " (<hostname>)". That is what lets one machine be revoked on GitHub without
# touching the others, and what makes a signature attributable to a machine.
authItemPrefix = "GitHub Machine Auth"
signItemPrefix = "GitHub Machine Sign"
# Kept for backwards compatibility with `braden-dots identity token` without an
# identity. New tokens are machine+identity scoped using tokenItemPrefix.
tokenItem = "GitHub Machine PAT"
tokenItemPrefix = "GitHub Machine PAT"
# One 1Password item per git identity, in the vault matching the machine's trust
# boundary. That vault IS the scope: a machine sees only identities deliberately
# placed in the vault it can read. A work vault may include a personal-repository
# identity backed by distinct keys made only for that work machine.
identityItemPrefix = "Git Identity"
identityEmailField = "email"
identityScopeField = "scope"
# chezmoi owns the one-line include; this file and the directory beside it are
# written at runtime from the vault. Relative to $HOME.
identityIncludeFile = ".config/git/identities.gitconfig"
identityDir = ".config/git/identities"
# An identity may own credentials on a SEPARATE GitHub account. The signal is
# simply that `GitHub Machine Auth (<machine> <slug>)` exists in the vault --
# `braden-dots identity provision` creates it; identity sync detects it. SSH then needs a host
# alias to choose between accounts, written here and pulled in by an Include
# from the chezmoi-managed ~/.ssh/config.
sshIncludeDir = ".ssh/config.d"
# The private-key reference is not listed here: reading it requires a
# `?ssh-format=openssh` query that only the loader understands, so the whole
# reference lives with the code that uses it rather than being half-declared.
publicKeyField = "public key"
tokenField = "credential"
tokenUserField = "username"
# Work machines hold keys in agent memory with a lifetime, so a revoked service
# account stops mattering by the next morning. Personal machines load without an
# expiry: revocation was never their threat model, and an unattended agent that
# finds a dead key at 3am cannot sign.
agentKeyLifetime = "9h"
# Where a work machine's service account token lives. The macOS Keychain gives
# stronger at-rest protection than a 0600 file, but it is not same-user process
# isolation while the login keychain is unlocked.
# The file remains a fallback for non-macOS hosts. The keychain SERVICE name is
# machine-local (see opTokenKeychainService in .chezmoi.toml.tmpl) because an
# existing item may already be named something else.
# Machine-local, never managed by chezmoi, never committed. Relative to $HOME.
serviceAccountTokenFile = ".config/op/service-account-token"

# The public source coordinates are deliberately non-secret. The SSH host is
# selected at runtime from this machine's configured default GitHub login and
# generated identity scopes.
[dotfilesSource]
owner = "Braden1996"
repository = "dotfiles"
primaryBranch = "master"

[runtimeSecrets."flow-icons"]
item = "Flow Icons License"
field = "license key"
fieldId = "credential"
profiles = ["personal", "work"]
optional = true
description = "Flow Icons licence"

[flowIcons]
revision = "0b7d8e039dd981a35475eb7b6d2093f412184627"
archiveSha256 = "f70290d55d4c4bb934ffc4b0ba0df8949120d2f483978a7a1b7f6c7c6a2d35b7"

[privacyEnv]
CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC = "1"
DO_NOT_TRACK = "1"
GH_TELEMETRY = "0"
GRAPHITE_DISABLE_TELEMETRY = "1"
GROK_TELEMETRY_ENABLED = "0"
HOMEBREW_NO_ANALYTICS = "1"
SST_TELEMETRY_DISABLED = "1"
YARN_ENABLE_TELEMETRY = "0"
